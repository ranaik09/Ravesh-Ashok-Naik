name: GoKarnaGo-Explore CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'GoKarnaGo-Explore/**'
      - '.github/workflows/main.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'GoKarnaGo-Explore/**'
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: gokarnago-explore
  DOCKER_REGISTRY: ghcr.io

jobs:
  build-docker:
    name: Build Flutter Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (Web target)
        uses: docker/build-push-action@v5
        with:
          context: ./GoKarnaGo-Explore
          file: ./GoKarnaGo-Explore/Dockerfile
          target: web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}-web
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (Artifacts target)
        uses: docker/build-push-action@v5
        with:
          context: ./GoKarnaGo-Explore
          file: ./GoKarnaGo-Explore/Dockerfile
          target: artifacts
          push: false
          tags: ${{ env.DOCKER_IMAGE_NAME }}:artifacts
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract build artifacts
        if: github.event_name != 'pull_request'
        run: |
          docker create --name artifacts ${{ env.DOCKER_IMAGE_NAME }}:artifacts
          docker cp artifacts:/artifacts ./build-artifacts
          docker rm artifacts

      - name: Upload APK artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-artifacts/apk/*.apk
          retention-days: 30

      - name: Upload AAB artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build-artifacts/aab/*.aab
          retention-days: 30

      - name: Upload Web build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build-artifacts/web/
          retention-days: 30

  flutter-analyze:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get dependencies
        working-directory: ./GoKarnaGo-Explore
        run: flutter pub get

      - name: Analyze code
        working-directory: ./GoKarnaGo-Explore
        run: flutter analyze

      - name: Run tests
        working-directory: ./GoKarnaGo-Explore
        run: flutter test || echo "No tests found - skipping"

      - name: Check formatting
        working-directory: ./GoKarnaGo-Explore
        run: dart format --set-exit-if-changed lib/

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-docker, flutter-analyze]
    if: always()
    permissions:
      contents: read
    
    steps:
      - name: Generate build summary
        run: |
          echo "## GoKarnaGo-Explore Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build: ${{ needs.build-docker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Flutter Analyze: ${{ needs.flutter-analyze.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "- Android APK (split per ABI)" >> $GITHUB_STEP_SUMMARY
          echo "- Android App Bundle (AAB)" >> $GITHUB_STEP_SUMMARY
          echo "- Flutter Web Build" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Image (Web server)" >> $GITHUB_STEP_SUMMARY
